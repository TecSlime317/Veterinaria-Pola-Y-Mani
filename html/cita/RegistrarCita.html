<!-- Documento HTML con el formulario para registrar una cita nueva evitando conflictos de llaves foráneas. Por: Diego Carballo -->
<!DOCTYPE html>
<html lang="es">
<head>
    <!-- diegoCar09: Configura la codificación de caracteres, la adaptación a pantallas móviles y el título de la pestaña. -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registrar cita - Veterinaria Pola y Maní</title>

    <!-- diegoCar09: Enlaza la hoja de estilos compartida subiendo dos niveles desde html/cita/. -->
    <link rel="stylesheet" href="../../css/index.css">
</head>
<body>
    <!-- diegoCar09: Recuadro principal centrado con el diseño estándar de index.css. -->
    <main class="contenedor">
        <!-- diegoCar09: Encabezado centrado con las huellitas inclinadas a ambos lados del título. -->
        <header class="encabezado">
            <h1>
                <span class="huella" aria-hidden="true">🐾</span>
                Registrar cita
                <span class="huella" aria-hidden="true">🐾</span>
            </h1>
        </header>

        <!-- diegoCar09: Párrafo dinámico que informa al usuario durante la carga inicial o al guardar una cita. -->
        <p id="mensaje-estado" class="subtitulo" role="status" style="text-align: center; margin-bottom: 16px;">Cargando dueños y mascotas...</p>

        <!-- diegoCar09: Formulario en cuadrícula adaptable (.formulario) para capturar los datos de la nueva cita. -->
        <form id="form-registrar-cita" class="formulario">
            <!-- diegoCar09: Lista desplegable que mostrará todos los dueños registrados en la base de datos. -->
            <div class="campo">
                <label for="ID_Dueno">Dueño *</label>
                <select id="ID_Dueno" name="ID_Dueno" required>
                    <option value="" disabled selected>Selecciona un dueño...</option>
                </select>
            </div>

            <!-- diegoCar09: Lista desplegable deshabilitada inicialmente hasta que se seleccione un dueño. -->
            <div class="campo">
                <label for="ID_Mascota">Mascota *</label>
                <select id="ID_Mascota" name="ID_Mascota" required disabled>
                    <option value="" disabled selected>Primero elige un dueño...</option>
                </select>
            </div>

            <!-- diegoCar09: Selector de calendario para elegir el día programado para la cita. -->
            <div class="campo">
                <label for="Fecha">Fecha *</label>
                <input type="date" id="Fecha" name="Fecha" required>
            </div>

            <!-- diegoCar09: Selector de reloj para indicar la hora exacta de la cita. -->
            <div class="campo">
                <label for="Hora">Hora *</label>
                <input type="time" id="Hora" name="Hora" required>
            </div>

            <!-- diegoCar09: Lista desplegable con los posibles estados iniciales de la cita. -->
            <div class="campo">
                <label for="Estado">Estado *</label>
                <select id="Estado" name="Estado" required>
                    <option value="" disabled selected>Selecciona...</option>
                    <option value="Pendiente">Pendiente</option>
                    <option value="Confirmada">Confirmada</option>
                    <option value="Completada">Completada</option>
                    <option value="Cancelada">Cancelada</option>
                </select>
            </div>

            <!-- diegoCar09: Nota aclaratoria que ocupa toda la fila inferior de la cuadrícula (.nota). -->
            <p class="nota">El ID de la cita se genera automáticamente. Selecciona un dueño para ver sus mascotas asociadas.</p>

            <!-- diegoCar09: Barra inferior centrada con los tres botones: Reiniciar, Registrar y Volver. -->
            <div class="acciones-formulario">
                <button type="reset" id="btn-reiniciar" class="boton boton-secundario">Reiniciar</button>
                <button type="submit" class="boton">Registrar</button>
                <a class="boton boton-secundario" href="IndexCita.html">Volver</a>
            </div>
        </form>
    </main>

    <!-- diegoCar09: Script que carga dueños y mascotas (GET), filtra mascotas por dueño y registra la cita (POST). -->
    <script>
        // diegoCar09: Guarda las referencias a los elementos del DOM que cambiarán dinámicamente.
        var selectDueno = document.getElementById('ID_Dueno');
        var selectMascota = document.getElementById('ID_Mascota');
        var formulario = document.getElementById('form-registrar-cita');
        var mensajeEstado = document.getElementById('mensaje-estado');
        var listaMascotas = [];

        // diegoCar09: Petición GET: Solicita al servidor las listas de dueños y mascotas existentes en formato JSON.
        fetch('../../php/cita/registrarCita.php')
            // diegoCar09: Convierte la respuesta HTTP recibida del servidor a un objeto JSON.
            .then(function (respuesta) 
            {
                return respuesta.json();
            })
            // diegoCar09: Recorre los arreglos recibidos para llenar el selector de dueños y guardar las mascotas.
            .then(function (datos) 
            {
                // diegoCar09: Si el servidor reporta un fallo, muestra el mensaje de error y detiene el proceso.
                if (!datos.exito) 
                {
                    mensajeEstado.textContent = datos.mensaje;
                    return;
                }

                // diegoCar09: Crea una etiqueta <option> por cada dueño con su ID y nombre completo.
                datos.duenos.forEach(function (dueno) 
                {
                    var opcion = document.createElement('option');
                    opcion.value = dueno.ID_Dueno;
                    opcion.textContent = dueno.ID_Dueno + ' - ' + dueno.Nombre + ' ' + dueno.Apellidos;
                    selectDueno.appendChild(opcion);
                });

                // diegoCar09: Almacena todas las mascotas en memoria para filtrarlas sin hacer nuevas peticiones al servidor.
                listaMascotas = datos.mascotas;
                // diegoCar09: Oculta el aviso de carga una vez que los datos están listos.
                mensajeEstado.style.display = 'none';
            })
            // diegoCar09: Captura fallos de red o de lectura JSON al intentar obtener los listados iniciales.
            .catch(function () 
            {
                mensajeEstado.textContent = 'Error de conexión al cargar dueños y mascotas.';
            });

        // diegoCar09: Evento change en Dueño: Filtra y muestra únicamente las mascotas que pertenecen al dueño elegido.
        selectDueno.addEventListener('change', function () 
        {
            // diegoCar09: Obtiene el ID del dueño recién seleccionado y reinicia el selector de mascotas.
            var idDuenoSeleccionado = selectDueno.value;
            selectMascota.innerHTML = '<option value="" disabled selected>Selecciona una mascota...</option>';

            // diegoCar09: Filtra el arreglo global comparando la llave foránea ID_Dueno de cada mascota.
            var mascotasDelDueno = listaMascotas.filter(function (mascota) 
            {
                return String(mascota.ID_Dueno) === String(idDuenoSeleccionado);
            });

            // diegoCar09: Si el dueño no tiene mascotas registradas, mantiene bloqueado el segundo selector.
            if (mascotasDelDueno.length === 0) 
            {
                selectMascota.innerHTML = '<option value="" disabled selected>Este dueño no tiene mascotas</option>';
                selectMascota.disabled = true;
            } 
            else 
            {
                // diegoCar09: Agrega al selector cada mascota encontrada y habilita el campo para elegirla.
                mascotasDelDueno.forEach(function (mascota) 
                {
                    var opcion = document.createElement('option');
                    opcion.value = mascota.ID_Mascota;
                    opcion.textContent = mascota.ID_Mascota + ' - ' + mascota.Nombre + ' (' + mascota.Especie + ')';
                    selectMascota.appendChild(opcion);
                });
                selectMascota.disabled = false;
            }
        });

        // diegoCar09: Evento reset: Restaura el selector de mascotas a su estado inicial bloqueado al limpiar el formulario.
        formulario.addEventListener('reset', function () 
        {
            setTimeout(function () 
            {
                selectMascota.innerHTML = '<option value="" disabled selected>Primero elige un dueño...</option>';
                selectMascota.disabled = true;
                mensajeEstado.style.display = 'none';
            }, 0);
        });

        // diegoCar09: Evento submit: Solicita confirmación al usuario y envía la nueva cita al servidor mediante POST.
        formulario.addEventListener('submit', function (evento) 
        {
            // diegoCar09: Evita el envío tradicional del formulario para procesar la respuesta sin recargar la página.
            evento.preventDefault();

            // diegoCar09: Obtiene los textos visibles y valores seleccionados para mostrarlos en la ventana emergente.
            var textoDueno = selectDueno.options[selectDueno.selectedIndex].text;
            var textoMascota = selectMascota.options[selectMascota.selectedIndex].text;
            var fecha = document.getElementById('Fecha').value;
            var hora = document.getElementById('Hora').value;
            var estado = document.getElementById('Estado').value;

            // diegoCar09: Construye el resumen de los datos antes de confirmar el alta en la base de datos.
            var resumen = '¿Deseas agendar esta nueva cita?\n\n' +
                          '• Dueño: ' + textoDueno + '\n' +
                          '• Mascota: ' + textoMascota + '\n' +
                          '• Fecha: ' + fecha + '\n' +
                          '• Hora: ' + hora + '\n' +
                          '• Estado: ' + estado;

            // diegoCar09: Si el usuario cancela en el cuadro de diálogo, detiene el envío.
            if (!confirm(resumen)) 
            {
                return;
            }

            // diegoCar09: Empaqueta todos los campos del formulario en un objeto FormData.
            var formData = new FormData(formulario);

            // diegoCar09: Petición POST: Envía los datos validados a registrarCita.php para insertarlos en MySQL.
            fetch('../../php/cita/registrarCita.php', {
                method: 'POST',
                body: formData
            })
            // diegoCar09: Convierte la respuesta del servidor de formato JSON a un objeto de JavaScript.
            .then(function (respuesta) 
            {
                return respuesta.json();
            })
            // diegoCar09: Muestra el mensaje de confirmación o error y limpia el formulario si el registro fue exitoso.
            .then(function (datos) 
            {
                if (datos.exito) 
                {
                    formulario.reset();
                }

                // diegoCar09: Se coloca al final para que el evento reset no oculte la confirmación de registro.
                setTimeout(function () 
                {
                    mensajeEstado.style.display = 'block';
                    mensajeEstado.textContent = datos.mensaje;
                }, 10);
            })
            // diegoCar09: Muestra un aviso si ocurre un fallo de conexión durante el envío.
            .catch(function () 
            {
                mensajeEstado.style.display = 'block';
                mensajeEstado.textContent = 'Error de conexión al intentar registrar la cita.';
            });
        });
    </script>
</body>
