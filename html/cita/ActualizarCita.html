<!-- diegoCar09: Documento HTML simplificado para editar una cita manteniendo únicamente los procesos fetch. -->
<!DOCTYPE html>
<html lang="es">
<head>
    <!-- diegoCar09: Configura la codificación, la adaptación a móviles y el título de la página. -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar cita - Veterinaria Pola y Maní</title>

    <!-- diegoCar09: Enlaza la hoja de estilos compartida subiendo dos niveles desde html/cita/. -->
    <link rel="stylesheet" href="../../css/index.css">
</head>
<body>
    <!-- diegoCar09: Contenedor principal centrado con el ancho estándar del diseño de referencia. -->
    <main class="contenedor">
        <!-- diegoCar09: Encabezado centrado con las huellitas inclinadas a ambos lados del título. -->
        <header class="encabezado">
            <h1>
                <span class="huella" aria-hidden="true">🐾</span>
                <span id="titulo-editar">Editar cita</span>
                <span class="huella" aria-hidden="true">🐾</span>
            </h1>

            <!-- diegoCar09: Subtítulo que muestra los nombres de la mascota y el dueño asociados al cargar los datos. -->
            <p id="info-relacionada" class="subtitulo" style="display: none;">
                <strong>Mascota:</strong> <span id="nombre-mascota"></span> |
                <strong>Dueño:</strong> <span id="nombre-dueno"></span>
            </p>
        </header>

        <!-- diegoCar09: Párrafo dinámico para mostrar mensajes de carga, confirmación o error. -->
        <p id="mensaje-estado" class="subtitulo" role="status" style="text-align: center; margin-bottom: 16px;">Cargando datos de la cita...</p>

        <!-- diegoCar09: Formulario en cuadrícula adaptable (.formulario) oculto hasta que PHP devuelva los datos actuales. -->
        <form id="form-actualizar-cita" class="formulario" style="display: none;">
            <!-- diegoCar09: Campo bloqueado (readonly) para mostrar el ID de la cita sin permitir editarlo. -->
            <div class="campo">
                <label for="ID_Cita">ID Cita</label>
                <input type="text" id="ID_Cita" name="ID_Cita" readonly>
            </div>

            <!-- diegoCar09: Campo bloqueado (readonly) para conservar el ID de la mascota sin permitir editarlo. -->
            <div class="campo">
                <label for="ID_Mascota">ID Mascota</label>
                <input type="text" id="ID_Mascota" name="ID_Mascota" readonly>
            </div>

            <!-- diegoCar09: Campo bloqueado (readonly) para conservar el ID del dueño sin permitir editarlo. -->
            <div class="campo">
                <label for="ID_Dueno">ID Dueño</label>
                <input type="text" id="ID_Dueno" name="ID_Dueno" readonly>
            </div>

            <!-- diegoCar09: Selector de calendario para cambiar la fecha de la cita. -->
            <div class="campo">
                <label for="Fecha">Fecha</label>
                <input type="date" id="Fecha" name="Fecha" required>
            </div>

            <!-- diegoCar09: Selector de reloj para cambiar la hora programada. -->
            <div class="campo">
                <label for="Hora">Hora</label>
                <input type="time" id="Hora" name="Hora" required>
            </div>

            <!-- diegoCar09: Lista desplegable con los estados válidos de una cita. -->
            <div class="campo">
                <label for="Estado">Estado</label>
                <select id="Estado" name="Estado" required>
                    <option value="" disabled>Selecciona...</option>
                    <option value="Pendiente">Pendiente</option>
                    <option value="Confirmada">Confirmada</option>
                    <option value="Completada">Completada</option>
                    <option value="Cancelada">Cancelada</option>
                </select>
            </div>

            <!-- diegoCar09: Barra inferior centrada con botones HTML nativos: Reiniciar (type="reset"), Guardar cambios y Volver. -->
            <div class="acciones-formulario">
                <button type="reset" class="boton boton-secundario">Reiniciar</button>
                <button type="submit" class="boton">Guardar cambios</button>
                <a class="boton boton-secundario" href="IndexCita.html">Volver</a>
            </div>
        </form>
    </main>

    <!-- diegoCar09: Script reducido estrictamente a los dos procesos fetch (cargar datos iniciales y enviar cambios). -->
    <script>
        var id = new URLSearchParams(window.location.search).get('id');
        var mensajeEstado = document.getElementById('mensaje-estado');
        var formulario = document.getElementById('form-actualizar-cita');
        var infoRelacionada = document.getElementById('info-relacionada');

        if (!id) {
            mensajeEstado.textContent = 'Se requiere un ID de cita válido.';
        } else {
            document.getElementById('titulo-editar').textContent = 'Editar cita #' + id;

            // diegoCar09: Primer fetch (GET): Obtiene los datos actuales de la cita desde actualizarCita.php.
            fetch('../../php/cita/actualizarCita.php?id=' + encodeURIComponent(id))
                .then(function (respuesta) { return respuesta.json(); })
                .then(function (datos) {
                    if (!datos.exito) {
                        mensajeEstado.textContent = datos.mensaje;
                        return;
                    }

                    // diegoCar09: Asigna defaultValue para que el botón HTML nativo type="reset" restaure estos valores sin JS.
                    var c = datos.cita;
                    document.getElementById('ID_Cita').defaultValue = c.ID_Cita;
                    document.getElementById('ID_Mascota').defaultValue = c.ID_Mascota;
                    document.getElementById('ID_Dueno').defaultValue = c.ID_Dueno;
                    document.getElementById('Fecha').defaultValue = c.Fecha;
                    document.getElementById('Hora').defaultValue = c.Hora;
                    document.getElementById('Estado').value = c.Estado;
                    document.querySelector('#Estado option[value="' + c.Estado + '"]').defaultSelected = true;

                    document.getElementById('nombre-mascota').textContent = c.NombreMascota || 'Sin nombre';
                    document.getElementById('nombre-dueno').textContent = ((c.NombreDueno || '') + ' ' + (c.ApellidosDueno || '')).trim();

                    mensajeEstado.style.display = 'none';
                    infoRelacionada.style.display = 'block';
                    formulario.style.display = 'grid';
                })
                .catch(function () { mensajeEstado.textContent = 'Error de conexión al cargar los datos de la cita.'; });
        }

        // diegoCar09: Segundo fetch (POST): Envía los cambios del formulario a actualizarCita.php para guardarlos en MySQL.
        formulario.addEventListener('submit', function (evento) {
            evento.preventDefault();

            fetch('../../php/cita/actualizarCita.php?id=' + encodeURIComponent(id), {
                method: 'POST',
                body: new FormData(formulario)
            })
            .then(function (respuesta) { return respuesta.json(); })
            .then(function (datos) {
                mensajeEstado.style.display = 'block';
                mensajeEstado.textContent = datos.mensaje;
            })
            .catch(function () {
                mensajeEstado.style.display = 'block';
                mensajeEstado.textContent = 'Error de conexión al guardar los cambios.';
            });
        });
    </script>
</body>
</html>
