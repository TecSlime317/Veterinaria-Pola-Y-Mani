<!-- diegoCar09: Documento que muestra los registros de citas consultados desde PHP. -->
<!DOCTYPE html>
<html lang="es">
<head>
    <!-- tecslime: Configura la codificación, la adaptación a pantallas y el título de la sección. -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Citas - Veterinaria Pola y Maní</title>

    <!-- diegoCar09: Enlaza la hoja de estilos compartida. Sube dos niveles (../../) porque este archivo está en html/cita/. -->
    <link rel="stylesheet" href="../../css/index.css">
</head>
<body>
    <main class="contenedor">

        <!-- diegoCar09: Barra superior: título (centro) y botón para añadir una cita nueva (derecha). -->
        <header class="barra-superior">
            <span class="izquierda"></span>

            <h1>
                <span class="huella" aria-hidden="true">🐾</span> 
                Citas
                <span class="huella" aria-hidden="true">🐾</span>
            </h1>

            <!-- diegoCar09: Lleva al formulario para dar de alta una cita. -->
            <a class="boton derecha" href="RegistrarCita.html">Agendar</a>
        </header>

        <!-- diegoCar09: Envoltorio que permite desplazar la tabla en pantallas pequeñas. -->
        <div class="tabla-contenedor">
            <!-- diegoCar09: Define las 7 columnas (6 de la tabla Cita en MySQL + 1 para acciones). -->
            <table class="tabla-datos">
                <thead>
                    <tr>
                        <th>ID Cita</th>
                        <th>ID Mascota</th>
                        <th>ID Dueño</th>
                        <th>Fecha</th>
                        <th>Hora</th>
                        <th>Estado</th>
                        <th>Acciones</th>
                    </tr>
                </thead>
                <!-- diegoCar09: El id "tablacita" es el que usa el script de abajo para insertar las filas. -->
                <tbody id="tablacita">
                    <!-- diegoCar09: Mensaje temporal que se reemplaza cuando PHP responde. -->
                    <tr class="fila-mensaje"><td colspan="7">Cargando citas...</td></tr>
                </tbody>
            </table>
        </div>

        <!-- diegoCar09: Botón para regresar a la pantalla de inicio. -->
        <div class="acciones-formulario">
            <a class="boton boton-secundario" href="../../index.html">Regresar al Index</a>
        </div>
    </main>

    <!-- diegoCar09: Solicita al endpoint PHP las filas de citas y gestiona la eliminación mediante fetch. -->
    <script>
        var cuerpoTabla = document.getElementById('tablacita');

        // tecslime: Petición fetch inicial para cargar las filas HTML desde consultasCita.php.
        fetch('../../php/cita/consultasCita.php')
            .then(function (respuesta) {
                if (!respuesta.ok) {
                    throw new Error('Respuesta HTTP ' + respuesta.status);
                }
                return respuesta.text();
            })
            .then(function (filas) {
                if (filas.trim() === '') {
                    cuerpoTabla.innerHTML = '<tr class="fila-mensaje"><td colspan="7">No hay citas registradas.</td></tr>';
                } else {
                    cuerpoTabla.innerHTML = filas;
                }
            })
            .catch(function (error) {
                cuerpoTabla.innerHTML = '<tr class="fila-mensaje"><td colspan="7">No se pudieron cargar las citas (' + error.message + ').</td></tr>';
            });

        // diegoCar09: Pide confirmación emergente y envía por fetch la orden de eliminación al pulsar Eliminar.
        cuerpoTabla.addEventListener('click', function (evento) {
            var botonEliminar = evento.target.closest('.boton-eliminar');
            if (!botonEliminar) {
                return;
            }

            var id = botonEliminar.getAttribute('data-id');

            // diegoCar09: Aviso emergente de confirmación antes de borrar el registro.
            if (!confirm('¿Seguro que deseas eliminar la cita con ID ' + id + '? Esta acción no se puede deshacer.')) {
                return;
            }

            fetch('../../php/cita/funcionesCita.php', {
                method: 'POST',
                headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                body: 'accion=eliminar&id=' + encodeURIComponent(id)
            })
            .then(function (respuesta) { return respuesta.json(); })
            .then(function (datos) {
                if (datos.exito) {
                    botonEliminar.closest('tr').remove();
                    alert(datos.mensaje);
                } else {
                    alert(datos.mensaje);
                }
            })
            .catch(function () { alert('Error de conexión al intentar eliminar la cita.'); });
        });
    </script>
</body>
</html>
