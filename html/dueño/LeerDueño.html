<!-- tecprime: Pantalla "Leer registro": muestra en modo solo lectura los datos de un dueño. Se llega desde el botón "Ver" de la lista de dueños. -->
<!DOCTYPE html>
<html lang="es">
<head>
    <!-- tecprime: Configura la codificación, la adaptación a pantallas y el título de la sección. -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Leer registro - Veterinaria Pola y Maní</title>

    <!-- tecprime: Enlaza la hoja de estilos compartida (dos niveles arriba: ../../). -->
    <link rel="stylesheet" href="../../css/index.css">
</head>
<body>
    <main class="contenedor contenedor-angosto">

        <!-- tecprime: Título de la pantalla; el subtítulo indica el ID consultado (lo llena el script de abajo). -->
        <header class="encabezado">
            <h1>
                <span class="huella" aria-hidden="true">🐾</span>
                Leer registro
                <span class="huella" aria-hidden="true">🐾</span>
            </h1>
            <p class="subtitulo">Dueño con ID: <strong id="idMostrado">—</strong></p>
        </header>

        <!-- tecprime: Tabla de una sola fila con los datos del dueño. Cada <td> tiene un id para que
             JavaScript (o PHP) pueda escribir el valor correspondiente. -->
        <div class="tabla-contenedor">
            <table class="tabla-datos tabla-centrada">
                <thead>
                    <tr>
                        <th>Nombre</th>
                        <th>Correo</th>
                        <th>Mascotas registradas</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <!-- tecprime: Los guiones son marcadores de posición hasta que el backend entregue los datos reales. -->
                        <td id="datoNombre">—</td>
                        <td id="datoCorreo">—</td>
                        <td id="datoMascotas">—</td>
                    </tr>
                </tbody>
            </table>
        </div>

        <!-- tecprime: Botón para regresar a la lista de dueños. -->
        <div class="acciones-formulario">
            <a class="boton boton-secundario" href="IndexDueño.html">Volver</a>
        </div>
    </main>

    <!-- tecprime: Script que muestra el ID recibido en la URL. -->
    <script>
        // tecprime: Lee el parámetro "id" de la URL (por ejemplo LeerDueño.html?id=3 -> "3").
        var parametros = new URLSearchParams(window.location.search);
        var id = parametros.get('id');

        // tecprime: Si hay ID, se muestra en el subtítulo; si no, se conserva el guion.
        if (id !== null && id !== '') {
            document.getElementById('idMostrado').textContent = id;
        }

        // tecprime: PENDIENTE DE BACKEND: para mostrar los datos reales se puede hacer
        // fetch('../../php/dueño/leerDueño.php?id=' + id) con respuesta JSON y asignar, con .textContent,
        // los valores a los elementos datoNombre, datoCorreo y datoMascotas.
    </script>
</body>
</html>
