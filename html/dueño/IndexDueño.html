<!-- tecprime: Documento que muestra los registros de dueños consultados desde PHP (operación "Leer" de la lista). -->
<!DOCTYPE html>
<html lang="es">
<head>
    <!-- tecprime: Configura la codificación, la adaptación a pantallas y el título de la sección. -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dueños - Veterinaria Pola y Maní</title>

    <!-- tecprime: Enlaza la hoja de estilos compartida. Sube dos niveles (../../) porque este archivo está en html/dueño/. -->
    <link rel="stylesheet" href="../../css/index.css">
</head>
<body>
    <main class="contenedor">

        <!-- tecprime: Barra superior: botón para volver al inicio (izquierda), título (centro)
             y botón para registrar un dueño nuevo (derecha). -->
        <header class="barra-superior">
            <a class="boton boton-secundario izquierda" href="../../index.html">Volver</a>

            <h1>
                <span class="huella" aria-hidden="true">🐾</span>
                Dueños
                <span class="huella" aria-hidden="true">🐾</span>
            </h1>

            <!-- tecprime: Lleva al formulario para dar de alta un dueño. -->
            <a class="boton derecha" href="RegistrarDueño.html">Registrar</a>
        </header>

        <!-- tecprime: Envoltorio que permite desplazar la tabla en pantallas pequeñas. -->
        <div class="tabla-contenedor">
            <!-- tecprime: Define las columnas de información y el cuerpo que recibirá las filas desde PHP.
                 IMPORTANTE: estas 10 columnas deben coincidir, en número y orden, con las celdas <td>
                 que imprime php/dueño/consultasDueño.php. Si no coinciden, la tabla se verá desalineada. -->
            <table class="tabla-datos">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Nombre</th>
                        <th>Apellidos</th>
                        <th>Edad</th>
                        <th>Teléfono</th>
                        <th>Correo electrónico</th>
                        <th>Dirección</th>
                        <th>Ciudad</th>
                        <th>Fecha de inscripción</th>
                        <th>Acciones</th>
                    </tr>
                </thead>
                <!-- tecprime: El id "tablaDuenos" es el que usa el script de abajo para insertar las filas. -->
                <tbody id="tablaDuenos">
                    <!-- tecprime: Mensaje temporal que se reemplaza cuando PHP responde. -->
                    <tr class="fila-mensaje"><td colspan="10">Cargando dueños...</td></tr>
                </tbody>
            </table>
        </div>
    </main>

    <!-- tecprime: Solicita al endpoint PHP las filas de dueños, las inserta en la tabla y atiende los botones de cada fila. -->
    <script>
        // tecprime: Guarda una referencia al cuerpo de la tabla para no buscarlo varias veces.
        var cuerpoTabla = document.getElementById('tablaDuenos');

        // tecprime: Solicita al servidor el HTML de las filas de dueños.
        // NOTA: esta página debe abrirse desde un servidor con PHP (por ejemplo http://localhost/...),
        // no con doble clic sobre el archivo, porque fetch no puede ejecutar PHP desde file://.
        fetch('../../php/dueño/consultasDueño.php')
            // tecprime: Si el servidor responde con error (404, 500...), se lanza una excepción para mostrar el aviso.
            .then(function (respuesta) {
                if (!respuesta.ok) {
                    throw new Error('Respuesta HTTP ' + respuesta.status);
                }
                // tecprime: Convierte la respuesta HTTP a texto HTML.
                return respuesta.text();
            })
            // tecprime: Inserta las filas recibidas en el cuerpo de la tabla.
            .then(function (filas) {
                // tecprime: Si PHP no devolvió ninguna fila, se informa que no hay registros.
                if (filas.trim() === '') {
                    cuerpoTabla.innerHTML = '<tr class="fila-mensaje"><td colspan="10">No hay dueños registrados.</td></tr>';
                } else {
                    cuerpoTabla.innerHTML = filas;
                }
            })
            // tecprime: Si algo falla (servidor apagado, ruta incorrecta, error de PHP), se muestra un aviso en la tabla.
            .catch(function (error) {
                cuerpoTabla.innerHTML = '<tr class="fila-mensaje"><td colspan="10">No se pudieron cargar los dueños (' + error.message + ').</td></tr>';
            });

        // tecprime: Los botones de cada fila los crea PHP DESPUÉS de cargar la página, por eso no se puede
        // asignar un clic a cada uno directamente. En su lugar se escucha el clic en toda la tabla
        // ("delegación de eventos") y se revisa cuál botón fue.
        cuerpoTabla.addEventListener('click', function (evento) {
            // tecprime: Busca el botón pulsado; si el clic no fue sobre un botón, no se hace nada.
            var boton = evento.target.closest('button');
            if (!boton) {
                return;
            }

            // tecprime: La primera celda de la fila contiene el ID del dueño (ver consultasDueño.php).
            var fila = boton.closest('tr');
            var id = fila.cells[0].textContent.trim();

            // tecprime: El texto del botón ("Ver", "Editar" o "Eliminar") indica qué acción se pidió.
            var accion = boton.textContent.trim();

            if (accion === 'Ver') {
                // tecprime: Abre la pantalla "Leer registro" enviando el ID en la URL (?id=...).
                window.location.href = 'LeerDueño.html?id=' + encodeURIComponent(id);
            } else if (accion === 'Editar') {
                // tecprime: Abre la pantalla "Actualizar dueño" enviando el ID en la URL (?id=...).
                window.location.href = 'ActualizarDueño.html?id=' + encodeURIComponent(id);
            } else if (accion === 'Eliminar') {
                // tecprime: Pide confirmación antes de borrar para evitar eliminaciones accidentales.
                if (confirm('¿Seguro que deseas eliminar al dueño con ID ' + id + '?')) {
                    // tecprime: PENDIENTE DE BACKEND: aquí debe llamarse al archivo PHP que elimina el registro
                    // (por ejemplo, enviando el ID por POST) y luego recargar la lista con location.reload().
                    alert('La eliminación aún no está conectada al servidor (ID ' + id + ').');
                }
            }
        });
    </script>
</body>
</html>
